[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "label_calculator"
version = "0.0.1"
description = "Label price calculator for self-adhesive labels — ERPNext v16 custom app"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.4.4",
    "mypy==1.20.0",
    "pre-commit==4.6.0",
    "pip-audit==2.10.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "frappe-mcp==0.1.0",
]

# ─── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["label_calculator"]

# ─── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false

# ─── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["label_calculator/tests"]
markers = [
    "unit: fast unit tests, no database or Frappe required",
    "integration: requires running Frappe + MariaDB instance",
    "slow: test that takes more than a few seconds",
]
