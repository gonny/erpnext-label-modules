version: 2
updates:
  # ─── Python (pip) ────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: "/apps/label_calculator"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python

  # ─── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions

  # ─── Docker ──────────────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker
