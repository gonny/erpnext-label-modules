name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

# Restrict default token permissions to the minimum needed.
permissions:
  contents: read

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff==0.4.4
      - name: ruff check
        run: ruff check apps/label_calculator/
      - name: ruff format check
        run: ruff format --check apps/label_calculator/

  # ─── Type Check ──────────────────────────────────────────────────────────
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install mypy
        run: pip install mypy==1.10.0
      - name: mypy
        run: mypy --ignore-missing-imports apps/label_calculator/label_calculator/

  # ─── Unit Tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (pytest -m unit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        working-directory: apps/label_calculator
        run: pip install pytest pytest-cov .
      - name: Run unit tests
        working-directory: apps/label_calculator
        run: pytest -m unit --tb=short -q

  # ─── Security ────────────────────────────────────────────────────────────
  security:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      - name: Audit dependencies
        working-directory: apps/label_calculator
        run: pip-audit --requirement <(pip show label_calculator 2>/dev/null || echo "") || true

  # ─── Integration Tests ───────────────────────────────────────────────────
  integration-tests:
    name: Integration tests (bench run-tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mariadb:
        image: mariadb:10.8
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -padmin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306
      redis-cache:
        image: redis:alpine
        ports:
          - 6379:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install bench CLI
        run: pip install frappe-bench

      - name: Init bench
        run: |
          bench init \
            --frappe-branch version-16 \
            --skip-redis-config-generation \
            --verbose \
            frappe-bench

      - name: Configure bench
        working-directory: frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port 3306
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6380"
          bench set-config -g redis_socketio "redis://127.0.0.1:6380"
          bench set-config -g developer_mode 1

      - name: Get ERPNext
        working-directory: frappe-bench
        run: bench get-app --branch version-16 erpnext

      - name: Link label_calculator app
        working-directory: frappe-bench
        run: ln -s ${{ github.workspace }}/apps/label_calculator apps/label_calculator

      - name: Create site
        working-directory: frappe-bench
        run: |
          bench new-site \
            --db-root-password admin \
            --admin-password admin \
            --no-mariadb-socket \
            test.localhost

      - name: Install apps
        working-directory: frappe-bench
        run: |
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app label_calculator

      - name: Run integration tests
        working-directory: frappe-bench
        run: bench run-tests --app label_calculator --site test.localhost
